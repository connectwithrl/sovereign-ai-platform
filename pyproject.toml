[project]
name = "sovereign-ai-platform"
version = "0.1.0"
description = "A self-hostable RAG + agent serving platform for regulated, data-sovereign environments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rahul Lamba", email = "connectwithrl@gmail.com" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
]

[project.optional-dependencies]
# Production retrieval path: PostgreSQL + pgvector.
pgvector = ["sqlalchemy>=2.0", "pgvector>=0.2.5", "psycopg[binary]>=3.1"]
# Real model serving / embedding backends.
serving = ["openai>=1.30", "boto3>=1.34"]
# Agent + MCP layer.
agent = ["mcp>=1.1", "pydantic-ai>=0.0.14"]
# Dev tooling.
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
sovereign-api = "sovereign.api:main"
sovereign-mcp = "sovereign.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sovereign"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
